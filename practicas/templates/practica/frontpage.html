<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor Académico</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;

            background:
                radial-gradient(circle at top left, #4f46e5, transparent 35%),
                radial-gradient(circle at bottom right, #06b6d4, transparent 35%),
                #0f172a;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 70px 40px;
            border-radius: 24px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;

            background: linear-gradient(90deg, #a5b4fc, #67e8f9);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #cbd5e1;
            font-size: 1.2rem;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.25);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        footer {
            margin-top: 45px;
            color: #64748b;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }

            .container {
                padding: 50px 25px;
            }
        }
    </style>
</head>

<body>

    <main id="frontpage" class="container">

        <div class="icon">🎓</div>

        <h1>Gestor Académico</h1>

        <p>
            Gestiona tus alumnos, asignaturas y prácticas
            desde un único lugar.
        </p>

        <div class="buttons">
            <a href="/api/v1/cursos/" id="btn-cursos" class="btn btn-primary">
                🚀 Comenzar
            </a>

            <a href="/admin/" id="btn-admin" class="btn btn-secondary">
                ⚙️ Administración
            </a>
        </div>

        <footer>
            © 2026 Gestor Académico
        </footer>

    </main>

</body>
</html>
